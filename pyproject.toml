[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "exmath"
requires-python = ">=3.8"
authors = [{ name = "Kiber2009", email = "92222946+Kiber2009@users.noreply.github.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Developers"
]
dynamic = ["version", "description", "license"]

[project.urls]
GitHub = "https://github.com/Kiber2009/exmath"
Issues = "https://github.com/Kiber2009/exmath/issues"
